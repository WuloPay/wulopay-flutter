version: 1.0.0
homepage: https://github.com/WuloPay/wulopay-flutter
repository: https://github.com/WuloPay/wulopay-flutter
issue_tracker: https://github.com/WuloPay/wulopay-flutter/issues
topics: [payments, checkout, wulopay]

environment:
